{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">
<section class="game-results">
    {% if results.won %}
    <h1>YOU SURVIVED</h1>
    <p>Lucky... {{ results.time_alive }} seconds. Your answers were deleted.</p>
    {% else %}
    <p>It's all mine. {{ results.time_alive }} seconds. Your answers remain saved.</p>
    {% endif %}
</section>
{% endblock %}
